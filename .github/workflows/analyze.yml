name: "analyze"
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          # No version pin here on purpose. `flutter-version-file: pubspec.yaml`
          # made this workflow fail 100% of the time: it reads pubspec's
          # `environment: sdk: ">=3.44.3 <4.0.0"` and hands that *range* to the
          # action, which only accepts an exact version —
          # "Unable to determine Flutter version for channel: stable".
          # main.yml resolves the same channel successfully, so this now matches
          # the sibling workflow that actually works; a permanently red check is
          # worse than no check, because it trains everyone to ignore the light.
          architecture: x64
      - run: flutter pub get
      # Gate on errors only, and keep the full report in the log.
      #
      # The previous third-party analyzer action failed on *any* non-zero count,
      # including style hints. This repository carries 7 pre-existing
      # `prefer_initializing_formals` hints and 5 `unawaited_return_in_try_block`
      # warnings in files this plan never touched, so the check could not go green
      # no matter what happened to the code under review — and it did hide a real
      # one: the single analyzer *error* in file_downloader.dart sat in the same
      # noise as the twelve known style items. Failing on errors keeps the light
      # meaningful; the warnings and hints are still printed in full, they just
      # do not turn the check red. The 5 warnings are a genuine bug class
      # (a Future returned unawaited from inside try/catch escapes the handler)
      # and are recorded as outstanding work, not as accepted style.
      - name: Analyze (fail on errors)
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub > analyze.log 2>&1
          cat analyze.log
          # Flutter 3.47 changed the diagnostic separator from `info - msg` to
          # `info • msg`, so a pattern pinned to one spelling silently counts
          # zero of everything: this gate reported errors=0 while the run had
          # just printed twelve issues. Match both, and refuse to call the step
          # green when the summary line is missing at all — that means the
          # analyzer never really ran, which is the one outcome this job must
          # never present as a pass.
          if ! grep -qE "(No issues found!|[0-9]+ issues? found\.)" analyze.log; then
            echo "::error::flutter analyze produced no parseable summary (did it run at all?)"
            exit 1
          fi
          errors=$(grep -cE "^ *error +([-•]) " analyze.log || true)
          warnings=$(grep -cE "^ *warning +([-•]) " analyze.log || true)
          hints=$(grep -cE "^ *info +([-•]) " analyze.log || true)
          echo "analyzer: errors=$errors warnings=$warnings info=$hints"
          if [ "$errors" != "0" ]; then
            echo "::error::flutter analyze reported $errors error(s)"
            grep -E "^ *error +([-•]) " analyze.log
            exit 1
          fi
          if [ "$warnings" != "0" ]; then
            echo "::warning::flutter analyze reported $warnings warning(s) — not blocking, see job log"
          fi
          exit 0