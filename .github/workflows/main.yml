name: Build ALL
run-name: Build ALL
on:
  push:
    tags:
      - "v*"
  # Pull requests run the full unit-test suite (Test job below). The build
  # jobs stay tag/dispatch-only: they are slow and produce artifacts no PR
  # consumes.
  #
  # No `paths` filter, on purpose. A required check that is skipped for a path
  # the filter does not know about never reports at all, and a filter that
  # misses a new source directory silently stops testing the code that matters.
  # The accepted tradeoff is that a doc-only PR still pays for a windows-latest
  # suite. If the runner bill ever justifies a filter, use `paths-ignore` for
  # `doc/**` and `**/*.md` only — never a positive `paths` list.
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build (release always builds all)"
        type: choice
        default: all
        required: false
        options:
          - all
          # Test job only: the fast path for iterating on CI itself, so a
          # workflow change can be proven without waiting for six platform
          # builds.
          - test
          - ios
          - android
          - windows
          - macos
          - linux
      ort_edition:
        description: "ONNX Runtime Windows edition (directml / cuda / cpu)"
        type: choice
        default: directml
        required: false
        options:
          - directml
          - cuda
          - cpu

permissions:
  contents: write

# A newer release tag supersedes any still-running older release build. A new
# push to a pull request supersedes that PR's previous test run, so stale
# commits stop burning a windows runner. Manual build-only dispatches use a
# unique group and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'release' || (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  Test:
    runs-on: windows-latest
    # The suite gates every PR. Cap it so one hung test cannot hold a runner
    # for the 6 h default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64
      - name: Fetch packages
        shell: bash
        run: flutter pub get

      # The guard's own regression test. It proves that the drift, floor,
      # stale-exclusion and cap paths can still fail; a guard nobody has ever
      # seen fire is decoration. Runs before the suite so a broken guard is not
      # discovered after 10 minutes of testing.
      - name: Guard self-test
        shell: bash
        run: dart run tool/ci/check_test_run.dart --self-test

      # FULL suite: no file list, so a newly added test file is picked up with
      # nothing to remember. The previous version of this step named 33 files
      # while 138 existed on disk, which is how 105 files / 789 cases went
      # unrun in every CI run ever performed.
      #
      # shell: bash, explicitly. This step was deleted once (commit a5ddd31)
      # because its bash guard hit a ParserError under the runner's default
      # PowerShell; naming the shell is what makes the pipeline below portable
      # and keeps a failing `flutter test` red through `set -e`.
      - name: Run the full unit-test suite
        shell: bash
        env:
          # Floor for executed (non-skipped) cases: a run in which everything
          # skips is green to `flutter test` and must not be green here.
          # Measured on the first full run (run 34352212854): 139/139 files,
          # 1245 executed, 1 skipped. 1100 keeps ~12% headroom for a genuine
          # test removal while still failing a swept-away or all-skipped suite.
          # Raise it as the suite grows; the step summary prints the margin.
          MIN_EXECUTED_TESTS: "1100"
        run: |
          set -euo pipefail
          mkdir -p ci-out
          # --machine emits one JSON event per line on stdout; everything the
          # tool prints goes to stderr, so the report stays parseable.
          set +e
          flutter test --machine --no-pub > ci-out/test_report.jsonl 2> ci-out/test_stderr.log
          flutter_status=$?
          set -e
          # Keep the tool's own output in the log: a suite that fails to load
          # says so here and nowhere else.
          cat ci-out/test_stderr.log || true
          dart run tool/ci/check_test_run.dart \
            --report ci-out/test_report.jsonl \
            --test-dir test \
            --exclusions tool/ci/ci_excluded_tests.txt \
            --min-executed "$MIN_EXECUTED_TESTS" \
            --flutter-exit "$flutter_status"

      # The raw report is the evidence behind every count in the summary.
      - name: Upload machine report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-machine-report
          path: ci-out/
          retention-days: 5
          if-no-files-found: ignore

  Build_MacOS:
    runs-on: macos-15
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
        # Step 1: Decode and install the certificate
      - name: Decode and install certificate
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ] && [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "macOS signing secrets are not configured; building unsigned macOS app."
            exit 0
          fi
          test -n "$CERTIFICATE" || { echo "CERTIFICATE secret is missing"; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "CERTIFICATE_PASSWORD secret is missing"; exit 1; }
          echo "$CERTIFICATE" | base64 --decode > signing_certificate.p12
          security import signing_certificate.p12 -k ~/Library/Keychains/login.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign

      - name: Check rust-toolchain.toml
        run: rustup show

      # Step 2: Build the Flutter macOS app
      # GIT_SHA is baked in so `--headless ocr-golden/--selfcheck` output can
      # prove which commit produced the binary (plan V6-9); the measurement
      # tool refuses a JSON whose "gitsha" is empty.
      - name: Build Flutter macOS App
        run: flutter build macos --release --dart-define=GIT_SHA=${{ github.sha }}

      # Step 3: Create the DMG file
      - name: Create DMG
        run: |
          mkdir -p dist
          mkdir -p dist/dmg_contents
          # Rename only the bundle directory: CFBundleExecutable still points at
          # the `venera` binary inside, and the signature covers the contents,
          # not the enclosing folder name.
          cp -R build/macos/Build/Products/Release/venera.app dist/dmg_contents/VeneraX.app
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create -volname "VeneraX" -srcfolder dist/dmg_contents -ov -format UDZO "dist/VeneraX.dmg"

      - name: Add version to filename
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv dist/VeneraX.dmg result/VeneraX-$APP_VERSION.dmg

      # Step 4: Attach and upload artifacts (optional)
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos_build
          path: result/
  Build_IOS:
    runs-on: macos-15
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=GIT_SHA=${{ github.sha }}
      - run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos/
          zip -r VeneraX-ios.ipa Payload
      - name: Add version to filename
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv build/ios/iphoneos/VeneraX-ios.ipa result/VeneraX-ios-$APP_VERSION.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: ios_build
          path: result/
  Build_Android:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    steps:
      - uses: actions/checkout@v7
      - run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64
      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
      - name: Detect Android signing secrets
        id: detect
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
            set -euo pipefail
            if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
              echo "mode=release" >> "$GITHUB_OUTPUT"
              echo "Android signing mode: official release"
            else
              echo "mode=fallback" >> "$GITHUB_OUTPUT"
              echo "Android signing secrets missing; generating fallback development keystore"
              keytool -genkeypair \
                -alias venerax \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -keystore android/fallback-release.keystore \
                -storepass android \
                -keypass android \
                -dname "CN=VeneraX Fallback, OU=Dev, O=Venera, L=Local, ST=Local, C=UN"
            fi
      - name: Decode and install Android signing files
        if: steps.detect.outputs.mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
            {
              printf 'storeFile=keystore.jks\n'
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > android/key.properties
      - name: Check rust-toolchain.toml
        run: rustup show
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=GIT_SHA=${{ github.sha }}
      - name: Verify Android signature continuity
        if: github.event_name == 'push' && steps.detect.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The universal APK is the ABI-less output; per-ABI ones carry an
          # -<abi> suffix (android/app/build.gradle outputFileName).
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          version="${version%%+*}"
          test -n "$version" || { echo "Missing version in pubspec.yaml"; exit 1; }
          current_apk="build/app/outputs/apk/release/VeneraX-${version}.apk"
          test -s "$current_apk" || {
            echo "Missing universal APK: $current_apk"
            ls -1 build/app/outputs/apk/release || true
            exit 1
          }
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)
          test -n "$apksigner" || { echo "apksigner not found"; exit 1; }

          # build-tools 37 prints "V2 Signer: certificate SHA-256 digest: <hex>"
          # where older ones print "Signer #1 certificate SHA-256 digest: <hex>",
          # so match the shared tail and fold the per-scheme repeats into one.
          read_digest() {
            sed -n 's/.*certificate SHA-256 digest: *//p' |
              tr 'A-Z' 'a-z' | sort -u
          }

          current_certs=$("$apksigner" verify --print-certs "$current_apk" 2>&1) || {
            echo "apksigner verify failed for $current_apk"
            printf '%s\n' "$current_certs"
            exit 1
          }
          current_digest=$(printf '%s\n' "$current_certs" | read_digest)
          test "$(printf '%s\n' "$current_digest" | grep -c .)" = "1" || {
            echo "Expected exactly one signer certificate in $current_apk"
            printf '%s\n' "$current_certs"
            exit 1
          }

          previous_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          previous_apk="previous-apk/VeneraX-${previous_tag#v}.apk"
          mkdir -p previous-apk
          gh release download "$previous_tag" \
            --pattern "VeneraX-${previous_tag#v}.apk" --dir previous-apk
          test -s "$previous_apk" || {
            echo "Missing universal APK in $previous_tag: $previous_apk"
            exit 1
          }
          previous_certs=$("$apksigner" verify --print-certs "$previous_apk" 2>&1) || {
            echo "apksigner verify failed for $previous_apk"
            printf '%s\n' "$previous_certs"
            exit 1
          }
          previous_digest=$(printf '%s\n' "$previous_certs" | read_digest)
          test "$(printf '%s\n' "$previous_digest" | grep -c .)" = "1" || {
            echo "Expected exactly one signer certificate in $previous_apk"
            printf '%s\n' "$previous_certs"
            exit 1
          }
          test "$current_digest" = "$previous_digest" || {
            echo "APK signing certificate mismatch with $previous_tag"
            echo "  current  ($version): $current_digest"
            echo "  previous ($previous_tag): $previous_digest"
            exit 1
          }
          echo "Android signer SHA-256: $current_digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: build/app/outputs/apk/release
  Build_Windows:
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    steps:
      - uses: actions/checkout@v7
      - name: install dependencies
        run: | 
          choco install yq -y
          pip install httpx
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64
      - name: Cache ORT runtime downloads
        uses: actions/cache@v4
        with:
          path: .cache/ort
          key: ort-${{ runner.os }}-${{ inputs.ort_edition || 'directml' }}-v1
      - name: build
        env:
          VENERA_ORT_EDITION: ${{ inputs.ort_edition || 'directml' }}
          # Why the define is not on a `flutter build windows` line here: this
          # file does not run that command. windows/build.py:11 calls
          # `flutter build windows` with a fixed argument list, and the Flutter
          # tool overwrites any DART_DEFINES environment value with its own
          # (verified against flutter_tools build_info.dart / tool_backend.dart
          # on 3.44.9), so an env-only injection cannot reach the compile.
          # GIT_SHA is therefore exported *for* that script; the step after this
          # one proves whether the artifact actually carries the sha.
          GIT_SHA: ${{ github.sha }}
        run: |
          flutter pub get
          python windows/build.py
      - name: Verify GIT_SHA attestation in the Windows artifact
        # The measurement tool refuses a baseline JSON whose "gitsha" is empty
        # (tool/ocr_run_stats.dart), so a Windows artifact that cannot name its
        # commit is unusable for G1/G2/G3 — say it here instead of discovering
        # it in doc/ocr-baseline.md later. Warning-only until windows/build.py
        # forwards GIT_SHA: delete `continue-on-error` once it does and this
        # becomes a hard gate.
        continue-on-error: true
        shell: pwsh
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          $so = "build/windows/x64/runner/Release/data/app.so"
          if (-not (Test-Path $so)) {
            Write-Host "::warning::no $so found - cannot verify GIT_SHA attestation"
            exit 0
          }
          # Dart string constants survive into the AOT snapshot verbatim (checked
          # locally: "[CLI PRINT]" and "imageTranslationOcrRecBatch" are both
          # findable in a release app.so), so a baked define value is detectable.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $so).Path)
          $text = [System.Text.Encoding]::Latin1.GetString($bytes)
          if ($text.Contains($env:GIT_SHA)) {
            Write-Host "OK: GIT_SHA=$($env:GIT_SHA) is compiled into the Windows artifact."
          } else {
            Write-Host "::warning::Windows artifact carries no GIT_SHA - windows/build.py must forward it as --dart-define=GIT_SHA=$($env:GIT_SHA). Baseline JSON from this build reports gitsha='' and tool/ocr_run_stats.dart will refuse it."
            exit 0
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows_build
          path: build/windows/VeneraX-*
  Build_Linux:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1 libayatana-appindicator3-dev
          dart pub global activate -s git https://github.com/venera-app/flutter_to_debian.git
      - run: python3 debian/build.py x64
      - run: dart run flutter_to_arch
      - run: |
          sudo rm -rf build/linux/arch/app.tar.gz
          sudo rm -rf build/linux/arch/pkg
          sudo rm -rf build/linux/arch/src
          sudo rm -rf build/linux/arch/PKGBUILD
      # Release files carry the app name; the dpkg/pacman package name stays
      # `venera` so existing installs keep upgrading in place.
      - name: Rename Linux packages
        run: |
          set -euo pipefail
          for f in build/linux/x64/release/debian/venera_*.deb; do
            [ -e "$f" ] || continue
            n="$(basename "$f")"; n="${n#venera_}"
            mv "$f" "$(dirname "$f")/VeneraX-${n//_/-}"
          done
          # The arch package is produced inside Docker via a bind mount, so it
          # is root-owned (same reason the cleanup above needs sudo).
          for f in build/linux/arch/venera-*.pkg.tar.zst; do
            [ -e "$f" ] || continue
            n="$(basename "$f")"
            sudo mv "$f" "$(dirname "$f")/VeneraX-${n#venera-}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deb_build
          path: build/linux/x64/release/debian
      - uses: actions/upload-artifact@v7
        with:
          name: arch_build
          path: build/linux/arch/
  Build_Linux_ARM64:
    runs-on: ubuntu-22.04-arm
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'master'
      - run: |
          flutter pub get
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1 libayatana-appindicator3-dev
          dart pub global activate -s git https://github.com/venera-app/flutter_to_debian.git
      - name: "Patch font"
        run: |
          dart run patch/font.dart
      - run: python3 debian/build.py arm64
      - name: Rename Linux packages
        run: |
          set -euo pipefail
          for f in build/linux/x64/release/debian/venera_*.deb; do
            [ -e "$f" ] || continue
            n="$(basename "$f")"; n="${n#venera_}"
            mv "$f" "$(dirname "$f")/VeneraX-${n//_/-}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deb_arm64_build
          path: build/linux/x64/release/debian # This is a bug related to flutter_to_debian, but it's not a big deal.

  Release:
    runs-on: ubuntu-22.04
    needs: [Test, Build_MacOS, Build_IOS, Build_Android, Build_Windows, Build_Linux, Build_Linux_ARM64]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      prerelease: ${{ steps.release_meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: ios_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: windows_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: deb_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: arch_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: deb_arm64_build
          path: outputs

      - name: Validate release inputs
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if compgen -G 'outputs/*-unsigned.apk' > /dev/null; then
            echo "Error: Refusing to publish unsigned fallback APKs to Release."
            echo "Official release requires valid Android signing secrets."
            exit 1
          fi
          existing_draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft 2>/dev/null || true)
          if [[ "$existing_draft" == "false" ]]; then
            echo "Release $TAG is already published; refusing to rebuild it"
            exit 1
          fi
          for lang in en zh-CN; do
            notes="release-notes/${TAG}.${lang}.md"
            test -s "$notes" || { echo "Missing or empty $notes"; exit 1; }
          done

          app_version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          version="${app_version%%+*}"
          test -n "$version" || { echo "Missing version in pubspec.yaml"; exit 1; }
          test "$TAG" = "v$version" || {
            echo "Tag $TAG does not match pubspec version $version"
            exit 1
          }

          mkdir -p release-assets
          shopt -s nullglob
          files=(
            outputs/*.ipa outputs/*.dmg outputs/*.apk outputs/*.zip
            outputs/*.exe outputs/*.deb outputs/*.zst outputs/*.AppImage
          )
          test "${#files[@]}" -gt 0 || { echo "No release assets found"; exit 1; }
          cp -- "${files[@]}" release-assets/

          require_asset() {
            compgen -G "$1" > /dev/null || {
              echo "Missing required release asset: $1"
              exit 1
            }
          }
          require_asset 'release-assets/*.ipa'
          require_asset 'release-assets/*.dmg'
          require_asset 'release-assets/*.apk'
          require_asset "release-assets/VeneraX-${version}.apk"
          require_asset 'release-assets/*.deb'
          require_asset 'release-assets/*.zst'
          if ! compgen -G 'release-assets/*.exe' > /dev/null &&
             ! compgen -G 'release-assets/*.zip' > /dev/null; then
            echo "Missing Windows installer/archive"
            exit 1
          fi
          while IFS= read -r asset; do
            test -s "$asset" || { echo "Empty release asset: $asset"; exit 1; }
          done < <(find release-assets -maxdepth 1 -type f -print)

          body_file="$RUNNER_TEMP/${TAG}.release-body.md"
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/release-notes"
          {
            printf '> **Language / 语言**: [English](%s/%s.en.md) · [简体中文](%s/%s.zh-CN.md)\n\n' \
              "$base" "$TAG" "$base" "$TAG"
            cat "release-notes/${TAG}.en.md"
          } > "$body_file"

          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "body_file=$body_file" >> "$GITHUB_OUTPUT"

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          body_path: ${{ steps.release_meta.outputs.body_file }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify draft release assets
        id: release_gate
        env:
          BODY_FILE: ${{ steps.release_meta.outputs.body_file }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/${TAG}.release.json"
          # A draft release is invisible to the get-release-by-tag endpoint (404
          # even once the tag exists), so locate it in the release list, which is
          # newest-first and does include drafts, then fetch it by id.
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$TAG\")) | .[0].id // empty")
          test -n "$release_id" || { echo "No release found for $TAG"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
          jq -e '.draft == true' "$release_json" > /dev/null
          jq -e --arg tag "$TAG" --argjson prerelease "$PRERELEASE" \
            '.tag_name == $tag and .prerelease == $prerelease and (.body | type == "string" and length > 0)' \
            "$release_json" > /dev/null
          jq -e '.assets | length > 0 and all(.[]; .state == "uploaded" and .size > 0)' \
            "$release_json" > /dev/null

          jq -r '.body' "$release_json" > "$RUNNER_TEMP/remote-release-body.md"
          # jq -r appends a trailing newline the stored body does not carry, so
          # fold trailing blank lines on both sides; real differences still fail.
          diff -u <(printf '%s\n' "$(cat "$BODY_FILE")") \
                  <(printf '%s\n' "$(cat "$RUNNER_TEMP/remote-release-body.md")")

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort \
            > "$RUNNER_TEMP/local-assets.txt"
          jq -r '.assets[].name' "$release_json" | sort \
            > "$RUNNER_TEMP/remote-assets.txt"
          diff -u "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt"
          echo "release_id=$(jq -r '.id' "$release_json")" >> "$GITHUB_OUTPUT"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(release edit "$TAG" --draft=false)
          if [[ "$PRERELEASE" == "false" ]]; then
            latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [[ -n "$latest_tag" && "$latest_tag" != "$TAG" ]]; then
              newest=$(printf '%s\n%s\n' "$latest_tag" "$TAG" | sort -V | tail -1)
              test "$newest" = "$TAG" || {
                echo "Refusing to publish $TAG after newer release $latest_tag"
                exit 1
              }
            fi
            args+=(--latest)
          fi
          gh "${args[@]}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq 'select(.draft == false and .published_at != null) | .html_url'

  Update_AltStore_Source:
    runs-on: ubuntu-22.04
    needs: [Release]
    # Pre-releases are for internal testing only: they must never be pushed to
    # AltStore users. (The in-app updater is safe by itself — GitHub's
    # releases/latest API never returns pre-releases — but this job would
    # otherwise overwrite the manifest with the beta.)
    if: ${{ needs.Release.result == 'success' && needs.Release.outputs.prerelease == 'false' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Gather release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/${TAG}.altstore-release.json"
          gh release view "$TAG" --json assets,publishedAt > "$release_json"
          IPA_COUNT=$(jq '[.assets[] | select(.name | endswith(".ipa"))] | length' "$release_json")
          test "$IPA_COUNT" -eq 1 || { echo "Expected exactly one IPA asset, found $IPA_COUNT"; exit 1; }
          DL=$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .url' "$release_json")
          SZ=$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .size' "$release_json")
          PUB=$(jq -r '.publishedAt' "$release_json" | cut -dT -f1)
          VER=$(git show "${TAG}:pubspec.yaml" | grep '^version:' | cut -d':' -f2 | tr -d ' ')
          VERSION=${VER%%+*}
          BUILD=${VER##*+}
          test -n "$DL" && test "$DL" != "null" || { echo "IPA URL missing"; exit 1; }
          test "$SZ" -gt 0 || { echo "IPA size is invalid: $SZ"; exit 1; }
          test -n "$PUB" && test "$PUB" != "null" || { echo "Release date missing"; exit 1; }
          test -n "$VERSION" && test "$VERSION" != "$VER" || { echo "Version/build missing: $VER"; exit 1; }
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "Invalid build number: $BUILD"; exit 1; }
          {
            echo "download_url=$DL"
            echo "size=$SZ"
            echo "pub_date=$PUB"
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
      - name: Regenerate AltStore manifest
        env:
          SOURCE_FILE: altstore-source.json
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          DOWNLOAD_URL: ${{ steps.meta.outputs.download_url }}
          SIZE: ${{ steps.meta.outputs.size }}
          PUB_DATE: ${{ steps.meta.outputs.pub_date }}
          MIN_OS: '14.0'
        run: |
          set -euo pipefail
          if [ -f "release-notes/${TAG}.en.md" ]; then
            export NOTES_FILE="release-notes/${TAG}.en.md"
          fi
          node .github/scripts/gen-altstore-source.mjs
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- altstore-source.json; then
            echo "altstore-source.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add altstore-source.json
          git commit -m "chore: 更新 AltStore 安装清单至 ${{ github.ref_name }}"
          git push origin HEAD:master

  # Beta counterpart of Update_AltStore_Source: pre-releases update ONLY the
  # separate beta manifest, which testers subscribe to explicitly. Stable users
  # (altstore-source.json + the in-app updater) never see these builds.
  Update_AltStore_Beta_Source:
    runs-on: ubuntu-22.04
    needs: [Release]
    if: ${{ needs.Release.result == 'success' && needs.Release.outputs.prerelease == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Gather release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/${TAG}.altstore-release.json"
          gh release view "$TAG" --json assets,publishedAt > "$release_json"
          IPA_COUNT=$(jq '[.assets[] | select(.name | endswith(".ipa"))] | length' "$release_json")
          test "$IPA_COUNT" -eq 1 || { echo "Expected exactly one IPA asset, found $IPA_COUNT"; exit 1; }
          DL=$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .url' "$release_json")
          SZ=$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .size' "$release_json")
          PUB=$(jq -r '.publishedAt' "$release_json" | cut -dT -f1)
          VER=$(git show "${TAG}:pubspec.yaml" | grep '^version:' | cut -d':' -f2 | tr -d ' ')
          VERSION=${VER%%+*}
          BUILD=${VER##*+}
          test -n "$DL" && test "$DL" != "null" || { echo "IPA URL missing"; exit 1; }
          test "$SZ" -gt 0 || { echo "IPA size is invalid: $SZ"; exit 1; }
          test -n "$PUB" && test "$PUB" != "null" || { echo "Release date missing"; exit 1; }
          test -n "$VERSION" && test "$VERSION" != "$VER" || { echo "Version/build missing: $VER"; exit 1; }
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "Invalid build number: $BUILD"; exit 1; }
          {
            echo "download_url=$DL"
            echo "size=$SZ"
            echo "pub_date=$PUB"
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
      - name: Regenerate beta AltStore manifest
        env:
          SOURCE_FILE: altstore-source-beta.json
          BETA: 'true'
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          DOWNLOAD_URL: ${{ steps.meta.outputs.download_url }}
          SIZE: ${{ steps.meta.outputs.size }}
          PUB_DATE: ${{ steps.meta.outputs.pub_date }}
          MIN_OS: '14.0'
        run: |
          set -euo pipefail
          if [ -f "release-notes/${TAG}.en.md" ]; then
            export NOTES_FILE="release-notes/${TAG}.en.md"
          fi
          node .github/scripts/gen-altstore-source.mjs
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- altstore-source-beta.json; then
            echo "altstore-source-beta.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add altstore-source-beta.json
          git commit -m "chore: 更新 AltStore 测试版清单至 ${{ github.ref_name }}"
          git push origin HEAD:master
