plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = false
if (keystorePropertiesFile.exists()) {
    try {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        hasReleaseKeystore = ["storeFile", "storePassword", "keyAlias", "keyPassword"].every { key ->
            def value = keystoreProperties[key]
            return value != null && !value.toString().trim().isEmpty() && (key != "storeFile" || rootProject.file(value).exists())
        }
    } catch (Exception ignored) {
        hasReleaseKeystore = false
    }
}
def signingMode = hasReleaseKeystore ? "release" :
        (System.getenv("REQUIRE_RELEASE_SIGNING") == "1" ? "error" : "fallback")
if (signingMode == "error") {
    throw new GradleException("Missing android/key.properties or keystore file for release signing")
}

android {
    namespace = "io.github.kyosee.venera"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "28.0.13004108"

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits{
        abi {
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            enable true
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions{
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties['storePassword']
            }
        }
        fallback {
            storeFile rootProject.file("fallback-release.keystore")
            storePassword "android"
            keyAlias "venerax"
            keyPassword "android"
        }
        debug {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties['storePassword']
            } else {
                storeFile rootProject.file("fallback-release.keystore")
                storePassword "android"
                keyAlias "venerax"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId = "io.github.kyosee.venera"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // flutter_onnxruntime: keep the ONNX Runtime Java API from R8
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs[signingMode == "release" ? "release" : "fallback"]
        }
        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs[signingMode == "release" ? "debug" : "fallback"]
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def suffix = signingMode == "fallback" ? "-unsigned" : ""
            if (variant.buildType.name == "release") {
                if (abi != null) {
                    outputFileName = "VeneraX-${variant.versionName}-${abi}${suffix}.apk"
                    def abiVersionCode = project.ext.abiCodes.get(abi)
                    if (abiVersionCode != null) {
                        versionCodeOverride = variant.versionCode * 10 + abiVersionCode
                    }
                } else {
                    outputFileName = "VeneraX-${variant.versionName}${suffix}.apk"
                    versionCodeOverride = variant.versionCode * 10
                }
            } else if (variant.buildType.name == "debug") {
                versionCodeOverride = variant.versionCode * 10 + 4
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // 提供 NotificationCompat 与 ContextCompat.startForegroundService，供后台下载前台服务使用。
    implementation 'androidx.core:core-ktx:1.13.1'
}
